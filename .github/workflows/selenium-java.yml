name: Daily Selenium Java Test

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JAVA SETUP
      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # MAVEN ALREADY AVAILABLE ON UBUNTU RUNNER
      - name: Check Maven version
        run: mvn -v

      - name: Build dependencies (skip tests)
        run: mvn clean install -DskipTests

      # INSTALL GOOGLE CHROME
      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      # INSTALL CHROMEDRIVER
      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      # SETUP DYNAMIC SCREENSHOT PATH
      - name: Set screenshot path
        id: screenshot-path
        run: |
          DATE=$(date '+%Y_%b_%d')
          SCREENSHOT_PATH="SelePractice/images/Screenshot_${DATE}.png"
          echo "SCREENSHOT_PATH=${SCREENSHOT_PATH}" >> $GITHUB_ENV

      # RUN SELENIUM TESTS
      - name: Run Selenium tests
        id: run-tests
        run: mvn test
        continue-on-error: true

      # LIST ALL FILES AFTER EXECUTION (for debugging)
      - name: List all files
        run: |
          echo "Listing full directory tree:"
          ls -R .

      # UPLOAD FULL TEST REPORTS DIRECTORY
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Test-Reports
          path: images
          if-no-files-found: error

      # UPLOAD CUCUMBER HTML REPORT
      - name: Upload Cucumber HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: Cucumber-HTML-Report
          path: target/cucumber-report.html
          if-no-files-found: error

      # UPLOAD SCREENSHOT
      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Screenshot
          path: ${{ env.SCREENSHOT_PATH }}
          if-no-files-found: warn

      # FAIL PIPELINE IF TESTS FAILED
      - name: Check test result
        if: steps.run-tests.outcome != 'success'
        run: exit 1
