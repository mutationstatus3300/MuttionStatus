name: Daily Selenium Java Test

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # JAVA SETUP
      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # MAVEN ALREADY AVAILABLE ON UBUNTU RUNNER
      - name: Check Maven version
        run: mvn -v

      - name: Build dependencies (skip tests)
        run: mvn clean install -DskipTests

      # PUBLIC GOOGLE CHROME INSTALL
      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      # PUBLIC CHROMEDRIVER INSTALL (Auto-matching Chrome version)
      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      # SETUP DYNAMIC SCREENSHOT PATH
      - name: Set screenshot path
        id: screenshot-path
        run: |
          DATE=$(date '+%Y_%b_%d')
          SCREENSHOT_PATH="SelePractice/images/Screenshot_${DATE}.png"
          echo "SCREENSHOT_PATH=${SCREENSHOT_PATH}" >> $GITHUB_ENV

      # RUN SELENIUM TESTS
      - name: Run Selenium tests
        id: run-tests
        run: mvn test
        continue-on-error: true

      # UPLOAD TEST REPORTS
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Test-Reports
          path: SelePractice/target
        if: always()

      # UPLOAD SCREENSHOT (dynamic)
      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Screenshot
          path: ${{ env.SCREENSHOT_PATH }}
        if: always()

      # FAIL THE JOB IF TESTS FAILED
      - name: Check test result
        if: steps.run-tests.outcome != 'success'
        run: exit 1
