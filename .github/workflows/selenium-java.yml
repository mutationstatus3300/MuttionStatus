name: Daily Selenium Java Test

# Schedule: runs daily at 7 AM UTC
on:
  schedule:
    - cron: '0 7 * * *'  # 7:00 AM UTC daily
  workflow_dispatch:  # allows manual trigger

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Java
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'   # Adjust Java version as needed
          distribution: 'temurin'

      # Step 3: Install dependencies with Maven (if using Maven)
      - name: Build and install dependencies
        run: mvn clean install -DskipTests

      # Step 4: Install Google Chrome
      - name: Install Google Chrome
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable

      # Step 5: Install ChromeDriver
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v1
        with:
          chrome-version: latest

      # Step 6: Run Selenium tests
      - name: Run Selenium tests
        run: mvn test  # or your custom command
